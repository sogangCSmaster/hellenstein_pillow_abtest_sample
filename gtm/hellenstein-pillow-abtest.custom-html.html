  function detailBadge(meta) {
    if (!isDetailMode || !meta) return "";
    return (
      '<div class="hst-detail-badge" aria-label="PPTX 변경 설명">' +
      "<strong>" +
      escapeHtml(meta.slide) +
      " · " +
      escapeHtml(meta.block) +
      "</strong>" +
      "<span>" +
      escapeHtml(meta.why) +
      "</span>" +
      "</div>"
    );
  }

    return (

      (isDetailMode ? " hst-detail-highlight" : "") +
      '" data-hst-block="' +
      id +
      '">' +
      detailBadge(meta) +
      '<img src="' +
      asset(file) +
      '" width="1000" height="1500" loading="eager" decoding="async" alt="' +
      escapeHtml(alt) +
      '">' +
      "</section>"

      '" data-hst-block="' +
      id +
      '">' +
      detailBadge(meta) +
      html +
      "</section>"
    );
  }

  function collectReviews() {
    var rows = Array.prototype.slice.call(
      document.querySelectorAll("#prdReview .detailreview_listtype.xans-record-")
    );
    return rows
      .map(function (row) {
        return {
          title: normalizeText(
            row.querySelector(".review_title") &&
              row.querySelector(".review_title").textContent
          ),
          content: normalizeText(
            row.querySelector(".review_content") &&
              row.querySelector(".review_content").textContent
          ),
          writer: normalizeText(
            row.querySelector(".review_writer") &&
              row.querySelector(".review_writer").textContent
          ),
          date: normalizeText(
            row.querySelector(".review_date") &&
              row.querySelector(".review_date").textContent
          ),
          rating: normalizeText(
            row.querySelector(".review_point img") &&
              row.querySelector(".review_point img").getAttribute("alt")
          )
        };
      })
      .filter(function (review) {
        return review.title || review.content;
      })
      .slice(0, 8);
  }

  function reviewCards(reviews) {
    if (!reviews.length) {
      return (
        '<div class="hst-review-card">' +
        '<div class="hst-review-label">실제 후기</div>' +
        "<blockquote>현재 페이지의 실제 리뷰 영역에서 후기를 불러오는 중입니다.</blockquote>" +
        "<footer>실제 리뷰 목록이 로드되면 이 영역에 표시됩니다.</footer>" +
        "</div>"
      );
    }
    return reviews
      .map(function (review) {
        var body = review.content || review.title;
        return (
          '<article class="hst-review-card">' +
          '<div class="hst-review-label">' +
          escapeHtml(review.rating || "실제 후기") +
          "</div>" +
          "<blockquote>" +
          escapeHtml(truncate(body, 112)) +
          "</blockquote>" +
          "<footer>" +
          escapeHtml(review.writer || "구매 고객") +
          (review.date ? " · " + escapeHtml(review.date) : "") +
          "</footer>" +
          "</article>"
        );
      })
      .join("");
  }

      detailMeta.social
    );
  }

      detailMeta.criteria

  function injectTopProof() {
    var box = document.querySelector(".infoAreabox");
    if (!box || document.querySelector(".hst-top-proof")) return;
    var proof = createElement(
      "\n      <div class=\"hst-top-proof\">\n        <strong>실제 후기에서 반복되는 만족 포인트</strong>\n        <p>높이 조절, 목 지지감, 관리 편의성을 구매 전에 먼저 확인하세요.</p>\n        <button type=\"button\" data-hst-review-jump>실제 후기 먼저 보기</button>\n      </div>\n      "
    );
    box.parentNode.insertBefore(proof, box.nextSibling);
  }

  function injectStickyCta() {
    if (document.querySelector(".hst-sticky-cta")) return;
    var sticky = createElement(
      "\n      <div class=\"hst-sticky-cta\" role=\"region\" aria-label=\"내 목의 베개 빠른 이동\">\n        <button type=\"button\" class=\"primary\" data-hst-purchase-jump>옵션 확인</button>\n        <button type=\"button\" class=\"secondary\" data-hst-review-jump>후기 보기</button>\n      </div>\n      "
    );
    document.body.appendChild(sticky);
  }

  function findPurchaseTarget() {
    return (
      document.querySelector(".detail-right .infoArea") ||
      document.querySelector(".detail-right #orderFixItem") ||
      document.querySelector(".detail-right") ||
      document.querySelector("#orderFixItem")
    );
  }

  function scrollToElement(target) {
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function bindActions(root) {
    document.addEventListener("click", function (event) {
      var reviewButton = event.target.closest("[data-hst-review-jump]");
      if (reviewButton) {
        event.preventDefault();
        pushEvent("hellenstein_pillow_abtest_review_jump_click");
        scrollToElement(
          document.querySelector('[data-hst-block="social-proof"]') ||
            document.querySelector("#prdReview")
        );
        return;
      }

      var purchaseButton = event.target.closest("[data-hst-purchase-jump]");
      if (purchaseButton) {
        event.preventDefault();
        pushEvent("hellenstein_pillow_abtest_sticky_cta_click");
        scrollToElement(findPurchaseTarget());
      }
    });
  }

  function render() {
    injectStyle();
    document.documentElement.classList.add("hst-pillow-abtest-active");

    var target = document.querySelector("#prdDetail .prdimages");
    if (!target) {
      window.__HST_PILLOW_ABTEST_RENDERED__ = false;
      return false;
    }

    target.innerHTML = buildPdpHtml();
    target.classList.add("hst-prdimages-replaced");

    injectTopProof();
    injectStickyCta();
    bindActions(target);

    pushEvent("hellenstein_pillow_abtest_rendered");
    return true;
  }

  function waitForRender() {
    var attempts = 0;
    var timer = window.setInterval(function () {
      attempts += 1;
      if (render() || attempts > 80) {
        window.clearInterval(timer);
      }
    }, 100);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", waitForRender);
  } else {
    waitForRender();
  }
})();
</script>
