  function escapeHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function normalizeText(value) {

    var text = normalizeText(value);
    if (text.length <= max) return text;
    return text.slice(0, max - 1).trim() + "…";

  function detailBadge(meta) {
    if (!isDetailMode || !meta) return "";
    return (
      '<div class="hst-detail-badge" aria-label="PPTX 변경 설명">' +
      "<strong>" +
      escapeHtml(meta.slide) +
      " · " +
      escapeHtml(meta.block) +
      "</strong>" +
      "<span>" +
      escapeHtml(meta.why) +
      "</span>" +
      "</div>"
    );
  }

  function imageBlock(id, file, alt, meta) {
    return (
      '<section class="hst-block hst-image-block' +
      (isDetailMode ? " hst-detail-highlight" : "") +
      '" data-hst-block="' +
      id +
      '">' +
      detailBadge(meta) +
      '<img src="' +
      asset(file) +
      '" width="1000" height="1500" loading="eager" decoding="async" alt="' +
      escapeHtml(alt) +
      '">' +
      "</section>"
    );
  }

      (isDetailMode ? " hst-detail-highlight" : "") +
      '" data-hst-block="' +
      id +

    );
  }

  function collectReviews() {
    var rows = Array.prototype.slice.call(
      document.querySelectorAll("#prdReview .detailreview_listtype.xans-record-")
    );
    return rows
      .map(function (row) {
        return {
          title: normalizeText(
            row.querySelector(".review_title") &&
              row.querySelector(".review_title").textContent
          ),
          content: normalizeText(
            row.querySelector(".review_content") &&
              row.querySelector(".review_content").textContent
          ),
          writer: normalizeText(
            row.querySelector(".review_writer") &&
              row.querySelector(".review_writer").textContent
          ),
          date: normalizeText(
            row.querySelector(".review_date") &&
              row.querySelector(".review_date").textContent
          )
        };
      })
      .filter(function (review) {
        return review.title || review.content;
      })
      .slice(0, 3);
  }

  function reviewCards(reviews) {
    if (!reviews.length) {
      return (
        '<div class="hst-review-card">' +
        '<div class="hst-stars">★★★★★</div>' +
        "<blockquote>현재 페이지의 실제 리뷰 영역에서 후기를 불러오는 중입니다.</blockquote>" +
        "<footer>실제 리뷰 목록이 로드되면 이 영역에 표시됩니다.</footer>" +
        "</div>"
      );
    }
    return reviews
      .map(function (review) {
        var body = review.content || review.title;
        return (
          '<article class="hst-review-card">' +
          '<div class="hst-stars">★★★★★</div>' +
          "<blockquote>" +
          escapeHtml(truncate(body, 112)) +
          "</blockquote>" +
          "<footer>" +
          escapeHtml(review.writer || "구매 고객") +
          (review.date ? " · " + escapeHtml(review.date) : "") +
          "</footer>" +
          "</article>"
        );
      })
      .join("");
  }

                <td>목, 머리, 어깨, 옆잠을 나눠 받치는 4분할 구조</td>
                <td>면 전체로 받치는 단순 구조</td>
                <td>목 지지 중심으로 장시간 사용감 차이가 생길 수 있음</td>
              </tr>
              <tr>
                <td>신뢰 근거</td>
                <td>5년 반복 테스트, FITI, 소재 안전성, 내구성 검증</td>
                <td>제품별 근거 확인이 어려운 경우가 있음</td>
                <td>인증과 소재 정보가 분산되어 비교가 번거로움</td>
              </tr>
              <tr>
                <td>관리</td>
                <td>사용 가이드와 케어 가이드를 함께 제공</td>
                <td>세탁과 관리 기준을 따로 찾아야 함</td>
                <td>구조가 복잡할수록 관리 기준 확인이 필요</td>
              </tr>
            </tbody>
          </table>
        </div>
      `,
      detailMeta.comparison
    );
  }

  function riskBlock() {
    return htmlBlock(
      "risk-reversal",
      `
        <span class="hst-eyebrow">처음 2주 안내</span>
        <h2>처음부터 맞추는 제품이 아니라, 내 몸에 맞게 조절하는 제품입니다</h2>
        <p>경추 베개는 체형과 수면 자세에 따라 적응감이 달라질 수 있습니다. 그래서 구매 전에는 높이 조절 방법과 적응 기간을 먼저 안내하고, 교환·반품 기준은 공식 정책으로 확인하게 둡니다.</p>
        <div class="hst-risk-grid">
          <div class="hst-risk-card"><strong>1단계</strong><p>첫날에는 기본 높이로 사용감을 확인합니다.</p></div>
          <div class="hst-risk-card"><strong>2단계</strong><p>목과 어깨 부담이 느껴지면 패드로 높이를 조절합니다.</p></div>
          <div class="hst-risk-card"><strong>3단계</strong><p>적응 기간과 공식 교환·반품 기준을 함께 확인합니다.</p></div>
        </div>
      `,
      detailMeta.risk
    );
  }

  function faqBlock() {
    return htmlBlock(
      "faq",
      `
        <span class="hst-eyebrow">FAQ</span>
        <h2>마지막 망설임을 먼저 답합니다</h2>
        <div class="hst-faq-list">
          <div class="hst-faq-item"><strong>왜 일반 베개보다 가격대가 높은가요?</strong><p>4단계 높이 조절, 4분할 지지 구조, 5년 반복 테스트, FITI와 소재 안전성 검증을 한 제품 안에 묶은 고관여 침구이기 때문입니다.</p></div>
          <div class="hst-faq-item"><strong>처음부터 바로 편해야 하나요?</strong><p>체형과 수면 자세에 따라 적응감이 다를 수 있습니다. 처음에는 기본 높이로 시작하고, 필요하면 패드로 높이를 조절하는 방식이 좋습니다.</p></div>
          <div class="hst-faq-item"><strong>옆으로 자는 사람도 쓸 수 있나요?</strong><p>목과 머리를 따로 받치는 구조라 옆으로 누웠을 때의 높이 차이를 줄이도록 설계된 제품입니다.</p></div>
          <div class="hst-faq-item"><strong>세탁과 관리는 어떻게 하나요?</strong><p>상세 하단의 사용 가이드, 케어 가이드, 세탁 안내를 기준으로 관리하면 됩니다. 제품 구조와 커버 관리를 함께 확인하세요.</p></div>
          <div class="hst-faq-item"><strong>부모님 선물로도 괜찮나요?</strong><p>베개 높이 취향을 정확히 몰라도 조절 가능한 구조라 선물 맥락에서도 설명하기 쉽습니다. 단, 개인 체형과 수면 습관에 맞춘 조절은 필요합니다.</p></div>
        </div>
      `,
      detailMeta.faq
    );
  }

  function buildPdpHtml() {
    return (
      '<div class="hst-pdp" id="hst-pillow-pdp">' +
      imageBlock("hero", "01-hero.webp", "내 목의 베개 핵심 가치와 4단계 높이 조절 베개 소개", detailMeta.hero) +
      imageBlock("problem", "02-problem.webp", "아침 목과 어깨 부담을 환기하는 문제 제기 컷", detailMeta.problem) +
      imageBlock("agitation", "03-agitation.webp", "잘 맞지 않는 베개가 반복되는 아침에 미치는 부담 컷", detailMeta.agitation) +
      imageBlock("solution", "04-solution.webp", "헬렌스타인이 5년간 높이 구조 소재를 다시 설계한 이유", detailMeta.solution) +
      socialProofBlock() +
      imageBlock("height", "05-height.webp", "4단계 높이 조절 기능과 고객 체감 이점", detailMeta.height) +
      imageBlock("structure", "06-structure.webp", "목과 머리를 따로 받치는 4분할 구조", detailMeta.structure) +
      comparisonBlock() +
      imageBlock("persona", "09-persona.webp", "내 목의 베개 추천 대상과 선물 맥락", detailMeta.persona) +
      riskBlock() +
      imageBlock("authority", "07-authority.webp", "FITI 인증 소재 안전성 내구성 검증", detailMeta.authority) +
      imageBlock("guide", "08-guide.webp", "사용 가이드 케어 가이드 제품 스펙", detailMeta.guide) +
      faqBlock() +
      imageBlock("final", "10-final.webp", "오늘 밤의 베개가 내일 아침을 바꾸는 마무리 컷", detailMeta.final) +
      "</div>"
    );
  }

  function injectTopProof() {
    var box = document.querySelector(".infoAreabox");
    if (!box || document.querySelector(".hst-top-proof")) return;
    var proof = createElement(
      `
      <div class="hst-top-proof">
        <strong>★★★★★ 5.0 · 후기 144개</strong>
        <p>4단계 높이 조절, 4분할 지지 구조, FITI·소재 안전성 검증까지 구매 전 한 번에 확인하세요.</p>
        <button type="button" data-hst-review-jump>실제 후기 먼저 보기</button>
      </div>
      `
    );
    box.parentNode.insertBefore(proof, box.nextSibling);
  }

  function injectStickyCta() {
    if (document.querySelector(".hst-sticky-cta")) return;
    var sticky = createElement(
      `
      <div class="hst-sticky-cta" role="region" aria-label="내 목의 베개 빠른 이동">
        <button type="button" class="primary" data-hst-purchase-jump>옵션 확인</button>
        <button type="button" class="secondary" data-hst-review-jump>후기 보기</button>
      </div>
      `
    );
    document.body.appendChild(sticky);
  }

  function findPurchaseTarget() {
    return (
      document.querySelector(".detail-right .infoArea") ||
      document.querySelector(".detail-right #orderFixItem") ||
      document.querySelector(".detail-right") ||
      document.querySelector("#orderFixItem")
    );
  }

  function scrollToElement(target) {
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function bindActions(root) {
    document.addEventListener("click", function (event) {
      var reviewButton = event.target.closest("[data-hst-review-jump]");
      if (reviewButton) {
        event.preventDefault();
        pushEvent("hellenstein_pillow_abtest_review_jump_click");
        scrollToElement(
          document.querySelector('[data-hst-block="social-proof"]') ||
            document.querySelector("#prdReview")
        );
        return;
      }

      var purchaseButton = event.target.closest("[data-hst-purchase-jump]");
      if (purchaseButton) {
        event.preventDefault();
        pushEvent("hellenstein_pillow_abtest_sticky_cta_click");
        scrollToElement(findPurchaseTarget());
      }
    });
  }

  function render() {
    injectStyle();
    document.documentElement.classList.add("hst-pillow-abtest-active");

    var target = document.querySelector("#prdDetail .prdimages");
    if (!target) {
      window.__HST_PILLOW_ABTEST_RENDERED__ = false;
      return false;
    }

    target.innerHTML = buildPdpHtml();
    target.classList.add("hst-prdimages-replaced");

    injectTopProof();
    injectStickyCta();
    bindActions(target);

    pushEvent("hellenstein_pillow_abtest_rendered");
    return true;
  }

  function waitForRender() {
    var attempts = 0;
    var timer = window.setInterval(function () {
      attempts += 1;
      if (render() || attempts > 80) {
        window.clearInterval(timer);
      }
    }, 100);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", waitForRender);
  } else {
    waitForRender();
  }
})();
</script>
