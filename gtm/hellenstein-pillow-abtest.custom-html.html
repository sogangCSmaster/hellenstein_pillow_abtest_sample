<!--
  GTM Custom HTML Tag
  Hellenstein "내 목의 베개" PDP proposal demo

  - Page URL contains product_no=8461
  - Page URL contains abtest=true

  URL modes:
  - ?product_no=8461&cate_no=906&display_group=1&abtest=true&detail=false
    Shows the proposed landing page only.
  - ?product_no=8461&cate_no=906&display_group=1&abtest=true&detail=true
    Shows the proposed landing page plus rationale panels based on the PPTX.

  The image files are static PDP cuts only. Clickable CTA behavior is inserted
  by this tag as HTML so it remains trackable and editable in GTM.
-->

      reason:
        "마지막 감성 컷으로 제품 기억을 남기고, 실제 구매 행동은 이미지가 아닌 Sticky HTML CTA가 담당합니다.",
      source: "PPT 10, 15"
    }
  ];

  function assetUrl(file) {
    return ASSET_BASE + file + "?v=" + encodeURIComponent(ASSET_VERSION);
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function installStyles() {
    if (document.getElementById("hst-abtest-style")) {
      return;
    }

    var style = document.createElement("style");
    style.id = "hst-abtest-style";
    style.textContent = [
      "#prdDetail .prdimages .hst-abtest-wrap{max-width:1000px;margin:0 auto;background:#fbfaf7;font-family:Apple SD Gothic Neo,Pretendard,Noto Sans KR,sans-serif;color:#1f2421;}",
      "#prdDetail .prdimages .hst-abtest-block{margin:0;padding:0;}",
      "#prdDetail .prdimages .hst-abtest-img{display:block;width:100%;max-width:1000px;height:auto;margin:0 auto;border:0;}",
      "#prdDetail .prdimages .hst-abtest-review{box-sizing:border-box;margin:0 auto;padding:44px 42px;background:#fffaf3;border-top:1px solid #e5ded2;border-bottom:1px solid #e5ded2;}",
      "#prdDetail .prdimages .hst-abtest-review-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px;}",
      "#prdDetail .prdimages .hst-abtest-review-title{margin:0;font-size:32px;line-height:1.28;font-weight:800;color:#1f2421;letter-spacing:0;}",
      "#prdDetail .prdimages .hst-abtest-review-score{flex:0 0 auto;text-align:right;font-size:18px;font-weight:800;color:#9a735f;}",
      "#prdDetail .prdimages .hst-abtest-review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}",
      "#prdDetail .prdimages .hst-abtest-review-card{box-sizing:border-box;min-height:148px;padding:22px 20px;border:1px solid #e3dacd;border-radius:14px;background:#fff;}",
      "#prdDetail .prdimages .hst-abtest-review-card strong{display:block;margin-bottom:12px;font-size:16px;line-height:1.35;color:#3d4d43;}",
      "#prdDetail .prdimages .hst-abtest-review-card p{margin:0;font-size:15px;line-height:1.55;color:#5e635c;word-break:keep-all;}",
      "#prdDetail .prdimages .hst-abtest-explain{box-sizing:border-box;margin:0 auto;padding:28px 34px 34px;background:#ffffff;border-top:1px solid #e4ddd2;border-bottom:1px solid #e4ddd2;}",
      "#prdDetail .prdimages .hst-abtest-explain-kicker{display:inline-flex;align-items:center;margin-bottom:12px;padding:7px 12px;border-radius:999px;background:#3d4d43;color:#fff;font-size:13px;font-weight:800;letter-spacing:.02em;}",
      "#prdDetail .prdimages .hst-abtest-explain-title{margin:0 0 10px;font-size:24px;line-height:1.35;font-weight:800;color:#1f2421;}",
      "#prdDetail .prdimages .hst-abtest-explain-body{margin:0;font-size:17px;line-height:1.65;font-weight:500;color:#60665f;word-break:keep-all;}",
      "#prdDetail .prdimages .hst-abtest-explain-source{margin-top:12px;font-size:13px;line-height:1.4;color:#9a735f;font-weight:700;}",
      ".hst-abtest-top-proof{box-sizing:border-box;margin:18px 0 0;padding:18px;border:1px solid #e2d8ca;border-radius:16px;background:#fbfaf7;font-family:Apple SD Gothic Neo,Pretendard,Noto Sans KR,sans-serif;color:#1f2421;}",
      ".hst-abtest-top-proof strong{display:block;margin-bottom:8px;font-size:16px;line-height:1.35;font-weight:800;color:#1f2421;}",
      ".hst-abtest-top-proof p{margin:0 0 12px;font-size:13px;line-height:1.55;color:#5d645d;word-break:keep-all;}",
      ".hst-abtest-top-proof ul{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;padding:0;list-style:none;}",
      ".hst-abtest-top-proof li{padding:10px 8px;border-radius:10px;background:#fff;border:1px solid #e6ddd1;text-align:center;font-size:12px;line-height:1.3;font-weight:700;color:#3d4d43;}",
      ".hst-abtest-sticky{position:fixed;left:50%;bottom:18px;z-index:2147483000;display:flex;align-items:center;justify-content:space-between;gap:18px;box-sizing:border-box;width:min(720px,calc(100% - 28px));padding:14px 16px 14px 20px;transform:translateX(-50%);border:1px solid rgba(31,36,33,.12);border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 14px 40px rgba(0,0,0,.18);backdrop-filter:blur(8px);font-family:Apple SD Gothic Neo,Pretendard,Noto Sans KR,sans-serif;}",
      ".hst-abtest-sticky strong{display:block;font-size:17px;line-height:1.25;color:#1f2421;}",
      ".hst-abtest-sticky span{display:block;margin-top:3px;font-size:13px;line-height:1.3;color:#666;}",
      ".hst-abtest-sticky button{flex:0 0 auto;border:0;border-radius:999px;background:#1f2421;color:#fff;padding:13px 20px;font-size:15px;font-weight:800;cursor:pointer;}",
      "@media (max-width:720px){#prdDetail .prdimages .hst-abtest-review{padding:30px 20px}#prdDetail .prdimages .hst-abtest-review-head{display:block}#prdDetail .prdimages .hst-abtest-review-title{font-size:25px}#prdDetail .prdimages .hst-abtest-review-score{text-align:left;margin-top:10px}#prdDetail .prdimages .hst-abtest-review-grid{grid-template-columns:1fr}#prdDetail .prdimages .hst-abtest-explain{padding:22px 20px 26px}.hst-abtest-top-proof ul{grid-template-columns:1fr}.hst-abtest-sticky{bottom:12px;border-radius:18px;align-items:flex-start}.hst-abtest-sticky strong{font-size:15px}.hst-abtest-sticky button{padding:12px 16px;font-size:14px}}"
    ].join("");
    document.head.appendChild(style);
  }

  function renderReviewModule() {
    return [
      '<section class="hst-abtest-review" aria-label="내 목의 베개 리뷰 요약">',
      '<div class="hst-abtest-review-head">',
      '<h3 class="hst-abtest-review-title">후기를 상세페이지 상단에서 먼저 확인하게 합니다.</h3>',
      '<div class="hst-abtest-review-score">★★★★★ 5.0<br>후기 144개</div>',
      "</div>",
      '<div class="hst-abtest-review-grid">',
      '<article class="hst-abtest-review-card"><strong>아침 목 부담</strong><p>“아침에 목 부담이 줄었다”는 유형의 후기를 상단에 노출해 문제 인식 직후 신뢰를 만듭니다.</p></article>',
      '<article class="hst-abtest-review-card"><strong>높이 조절 체감</strong><p>4단계 높이 조절이 실제로 어떤 상황에서 도움이 되는지 리뷰 문맥으로 보여줍니다.</p></article>',
      '<article class="hst-abtest-review-card"><strong>선물 수요</strong><p>부모님 선물처럼 19만원대 가격을 설명할 수 있는 구매 맥락을 별도로 확보합니다.</p></article>',
      "</div>",
      "</section>"
    ].join("");
  }

  function renderDetailImages(container) {
    var html = '<div class="hst-abtest-wrap" data-hst-abtest-detail="' + String(isDetailMode) + '">';

    blocks.forEach(function (block, index) {
      html += '<section class="hst-abtest-block" data-hst-block="' + escapeHtml(block.title) + '">';
      html +=
        '<img class="hst-abtest-img" src="' +
        escapeHtml(assetUrl(block.file)) +
        '" alt="' +
        escapeHtml(block.alt) +
        '" width="1000" loading="' +
        (index < 2 ? "eager" : "lazy") +
        '" decoding="async">';

      if (isDetailMode) {
        html += '<div class="hst-abtest-explain">';
        html += '<div class="hst-abtest-explain-kicker">WHY THIS BLOCK</div>';
        html += '<h3 class="hst-abtest-explain-title">' + escapeHtml(block.title) + '</h3>';
        html += '<p class="hst-abtest-explain-body">' + escapeHtml(block.reason) + '</p>';
        html += '<div class="hst-abtest-explain-source">' + escapeHtml(block.source) + '</div>';
        html += '</div>';
      }

      html += "</section>";

      if (index === 0) {
        html += renderReviewModule();
      }
    });

    html += "</div>";
    container.innerHTML = html;
    container.setAttribute("data-hst-abtest-rendered", "true");
  }

  function mountTopProof() {
    if (document.querySelector(".hst-abtest-top-proof")) {
      return;
    }

    var infoBox = document.querySelector(".infoArea .infoAreabox");
    if (!infoBox || !infoBox.parentNode) {
      return;
    }

    var proof = document.createElement("div");
    proof.className = "hst-abtest-top-proof";
    proof.innerHTML = [
      "<strong>★★★★★ 5.0 · 후기 144개</strong>",
      "<p>상세 이미지까지 내려가기 전에 가격, 신뢰, 핵심 차별점을 먼저 확인하게 합니다.</p>",
      "<ul>",
      "<li>4단계<br>높이 조절</li>",
      "<li>4분할<br>지지 구조</li>",
      "<li>FITI<br>인증 소재</li>",
      "</ul>"
    ].join("");

    infoBox.parentNode.insertBefore(proof, infoBox.nextSibling);
  }

  function mountStickyCta() {
    if (document.querySelector(".hst-abtest-sticky")) {
      return;
    }

    var sticky = document.createElement("div");
    sticky.className = "hst-abtest-sticky";
    sticky.innerHTML =
      '<div><strong>내 목의 베개 · AB 테스트 시안</strong><span>191,700원 · 후기 144개 · 4단계 높이 조절</span></div><button type="button">구매 영역 보기</button>';

    sticky.querySelector("button").addEventListener("click", function () {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: "hellenstein_pillow_abtest_cta_click",
        product_no: TARGET_PRODUCT_NO,
        detail_mode: isDetailMode ? "true" : "false"
      });

      var target =
        document.querySelector("#orderFixItem") ||
        document.querySelector(".detail-right") ||
        document.querySelector(".infoArea");

      if (target && target.scrollIntoView) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });

    document.body.appendChild(sticky);
  }

  function pushRenderedEvent() {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      event: "hellenstein_pillow_abtest_rendered",
      product_no: TARGET_PRODUCT_NO,
      detail_mode: isDetailMode ? "true" : "false",
      block_count: blocks.length,
      asset_version: ASSET_VERSION
    });
  }

  function tryRender() {
    var container = document.querySelector("#prdDetail .prdimages");
    if (!container) {
      return false;
    }

    if (container.getAttribute("data-hst-abtest-rendered") === "true") {
      return true;
    }

    installStyles();
    mountTopProof();
    renderDetailImages(container);
    mountStickyCta();
    pushRenderedEvent();
    return true;
  }

  function boot() {
    if (tryRender()) {
      return;
    }

    var attempts = 0;
    var timer = window.setInterval(function () {
      attempts += 1;
      if (tryRender() || attempts >= 80) {
        window.clearInterval(timer);
      }
    }, 100);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
