  function collectReviews() {
    var rows = Array.prototype.slice.call(
      document.querySelectorAll("#prdReview .detailreview_listtype.xans-record-")
    );
    return rows
      .map(function (row) {
        return {
          title: normalizeText(
            row.querySelector(".review_title") &&
              row.querySelector(".review_title").textContent
          ),
          content: normalizeText(
            row.querySelector(".review_content") &&
              row.querySelector(".review_content").textContent
          ),
          writer: normalizeText(
            row.querySelector(".review_writer") &&
              row.querySelector(".review_writer").textContent
          ),
          date: normalizeText(
            row.querySelector(".review_date") &&
              row.querySelector(".review_date").textContent
          ),
          rating: normalizeText(
            row.querySelector(".review_point img") &&
              row.querySelector(".review_point img").getAttribute("alt")
          )
        };
      })
      .filter(function (review) {
        return review.title || review.content;
      })
      .slice(0, 8);
  }

  function reviewCards(reviews) {
    if (!reviews.length) {
      return (
        '<div class="hst-review-card">' +
        '<div class="hst-review-label">실제 후기</div>' +
        "<blockquote>현재 페이지의 실제 리뷰 영역에서 후기를 불러오는 중입니다.</blockquote>" +
        "<footer>실제 리뷰 목록이 로드되면 이 영역에 표시됩니다.</footer>" +
        "</div>"
      );
    }
    return reviews
      .map(function (review) {
        var body = review.content || review.title;
        return (
          '<article class="hst-review-card">' +
          '<div class="hst-review-label">' +
          escapeHtml(review.rating || "실제 후기") +
          "</div>" +
          "<blockquote>" +
          escapeHtml(truncate(body, 112)) +
          "</blockquote>" +
          "<footer>" +
          escapeHtml(review.writer || "구매 고객") +
          (review.date ? " · " + escapeHtml(review.date) : "") +
          "</footer>" +
          "</article>"
        );
      })
      .join("");
  }

    var scrollTimer = null;

    if (!sticky || isMobileViewport()) {
      if (sticky) sticky.classList.remove("is-visible");
      return;
    }

    if (!purchaseTarget) {
      sticky.classList.add("is-visible");
      return;
    }

    function update() {
      var rect = purchaseTarget.getBoundingClientRect();
      var viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      var isPurchaseVisible = rect.bottom > 80 && rect.top < viewportHeight - 120;
      if (isPurchaseVisible) {
        sticky.classList.remove("is-visible");
      } else {
        sticky.classList.add("is-visible");
      }
    }

    function throttledUpdate() {
      if (scrollTimer) return;
      scrollTimer = window.setTimeout(function () {
        scrollTimer = null;
        update();
      }, 80);
    }

    if ("IntersectionObserver" in window) {
      var observer = new IntersectionObserver(
        function (entries) {
          var visible = false;
          var i;
          for (i = 0; i < entries.length; i += 1) {
            if (entries[i].isIntersecting) visible = true;
          }
          if (visible) {
            sticky.classList.remove("is-visible");
          } else {
            sticky.classList.add("is-visible");
          }
        },
        { root: null, threshold: 0.05, rootMargin: "-80px 0px -120px 0px" }
      );
      observer.observe(purchaseTarget);
    } else {
      window.addEventListener("scroll", throttledUpdate);
    }

    window.addEventListener("resize", throttledUpdate);
    update();
  }

  function ensureFullDetailShell() {
    var detailArea = document.querySelector(".detailArea");
    var additional =
      document.querySelector(".detail-left .xans-product-additional") ||
      document.querySelector(".hst-full-detail-shell .xans-product-additional");
    var stickyNav =
      document.querySelector(".detail-left #stickyNav") ||
      document.querySelector(".hst-full-detail-shell #stickyNav");
    var detailGuide = document.querySelector(".detail-right #detailguide");
    var shell = document.querySelector(".hst-full-detail-shell");

    if (!detailArea || !detailArea.parentNode || !additional) return null;

    if (!shell) {
      shell = document.createElement("div");
      shell.className = "hst-full-detail-shell";
      shell.setAttribute("data-hst-layout", "full-detail-shell");
      if (detailArea.nextSibling) {
        detailArea.parentNode.insertBefore(shell, detailArea.nextSibling);
      } else {
        detailArea.parentNode.appendChild(shell);
      }
    }

    if (stickyNav && stickyNav.parentNode !== shell) {
      shell.appendChild(stickyNav);
    }

    if (additional.parentNode !== shell) {
      shell.appendChild(additional);
    }

    if (detailGuide && shell.parentNode && detailGuide.parentNode !== shell.parentNode) {
      if (shell.nextSibling) {
        shell.parentNode.insertBefore(detailGuide, shell.nextSibling);
      } else {
        shell.parentNode.appendChild(detailGuide);
      }
    }

    shell.classList.add("is-ready");
    additional.classList.add("hst-additional-relocated");

    return {
      shell: shell,
      target: additional.querySelector("#prdDetail .prdimages")
    };
  }

  function bindActions(root) {
    document.addEventListener("click", function (event) {
      var reviewButton = event.target.closest("[data-hst-review-jump]");
      if (reviewButton) {
        event.preventDefault();
        pushEvent("hellenstein_pillow_abtest_review_jump_click");
        scrollToElement(
          document.querySelector('[data-hst-block="social-proof"]') ||
            document.querySelector("#prdReview")
        );
        return;
      }

      var purchaseButton = event.target.closest("[data-hst-purchase-jump]");
      if (purchaseButton) {
        event.preventDefault();
        pushEvent("hellenstein_pillow_abtest_sticky_cta_click");
        scrollToElement(findPurchaseTarget());
      }
    });
  }

  function render() {
    injectStyle();
    document.documentElement.classList.add("hst-pillow-abtest-active");

    var layout = ensureFullDetailShell();
    var target = layout && layout.target ? layout.target : document.querySelector("#prdDetail .prdimages");

    if (layout && layout.target) {
      document.documentElement.classList.add("hst-pillow-abtest-full-detail");
    } else if (target) {
      pushEvent("hellenstein_pillow_abtest_layout_fallback", {
        reason: "full_detail_shell_unavailable"
      });
    }

    if (!target) {
      window.__HST_PILLOW_ABTEST_RENDERED__ = false;
      return false;
    }

    target.innerHTML = buildPdpHtml();
    target.classList.add("hst-prdimages-replaced");

    injectTopProof();
    injectStickyCta();
    bindActions(target);

    pushEvent("hellenstein_pillow_abtest_rendered");
    return true;
  }

  function waitForRender() {
    var attempts = 0;
    var timer = window.setInterval(function () {
      attempts += 1;
      if (render() || attempts > 80) {
        window.clearInterval(timer);
      }
    }, 100);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", waitForRender);
  } else {
    waitForRender();
  }
})();
</script>
